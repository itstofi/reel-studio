[project]
name = "reelstudio"
version = "0.1.0"
description = "Local editor for Jweed's talking-head Instagram Reels: 4K60 HEVC delivery, English captions, HyperFrames graphics, voice generation, adversarial QA."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "python-multipart>=0.0.9",
  "numpy>=1.26",
  "opencv-python-headless>=4.10,<5",
  "rapidfuzz>=3.9",
  "arabic-reshaper>=3.0",
  "anthropic>=0.40",
  "elevenlabs>=1.0",
  "httpx>=0.27",
  "mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.optional-dependencies]
faster = ["faster-whisper>=1.0"]

[dependency-groups]
dev = ["pytest>=8", "pytest-timeout>=2.3"]

[project.scripts]
reel = "reelstudio.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reelstudio"]

[tool.uv]
python-preference = "managed"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: end-to-end media tests that run ffmpeg/whisper for minutes",
  "network: needs internet or API keys",
]
addopts = "-m 'not slow and not network'"
