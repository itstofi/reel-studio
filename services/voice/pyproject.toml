[project]
name = "reel-voice"
version = "0.1.0"
description = "Reel Studio local voice sidecar: Chatterbox Multilingual V3 on MPS behind a 127.0.0.1 FastAPI."
requires-python = ">=3.11,<3.12"
dependencies = [
    # Upstream master pinned: V3 multilingual checkpoint (t3_model='v3') is not on PyPI.
    "chatterbox-tts @ git+https://github.com/resemble-ai/chatterbox@ab55923c27757c90cfcc407baa57dc25a7d25217",
    # Pinned watermarker (chatterbox master depends on Perth@master, unpinned).
    "resemble-perth @ git+https://github.com/resemble-ai/Perth@ff1c8ac55a976971245cdd53c18d6131ca00d993",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "soundfile>=0.12",
]

[project.scripts]
reel-voice = "reel_voice.serve:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reel_voice"]

[tool.hatch.metadata]
allow-direct-references = true
